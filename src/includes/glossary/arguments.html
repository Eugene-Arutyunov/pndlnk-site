<div class="term">
  <p>
    <strong>Аргументы</strong> Сообщение о взаимосвязи нескольких блоков ценностного предложения. Любой аргумент — это минимум два блока; аргумент об одном блоке невалиден. Чем больше
    блоков соединяет аргумент, тем сложнее выразить его словами — и тем чаще используются невербальные средства: дизайн, символы, цвет.
  </p>
