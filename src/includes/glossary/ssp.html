<div class="term" id="ssp">
  <p><strong>ССП</strong> Стартовая сессия проблематизации. Длительное (3–5 часов) мероприятие в формате фасилитационного обсуждения, на котором команда бюро и внутренние эксперты Заказчика работают над общим видением клиентского опыта «как есть» — глазами людей, которые этот опыт формируют.</p>
</div>
