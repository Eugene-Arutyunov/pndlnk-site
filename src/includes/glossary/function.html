<div class="term">
  <p>
    <strong>Функция</strong> Название целенаправленного изменения системы из некоторого начального состояния в некоторое конечное — как уже существующего, так и проектируемого.
    Функция говорит, что меняется, но не то, каким способом: способ задаётся процессами.
  </p>
</div>
