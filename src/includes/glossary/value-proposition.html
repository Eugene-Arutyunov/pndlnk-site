<div class="term">
  <p><strong>Ценностное предложение</strong> Устройство сделки между&nbsp;компанией и&nbsp;клиентом: кто этот клиент, что мешает ему жить по-старому, что он получает, что отдаёт и&nbsp;какой смысл видит в&nbsp;обмене. Сделка состоится, когда все эти части согласованы между&nbsp;собой, — ценностное предложение позволяет проверить это заранее.</p>
</div>
