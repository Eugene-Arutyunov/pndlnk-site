<div class="term">
  <p>
    <strong>Вклад клиента</strong> Форма и размер того, что клиент отдаёт в обмен. Материальный вклад — прямая цена, а также скидки, кэшбэки и всё, что этот вклад уменьшает.
    Нематериальный — время, усилия, решения. Цена не характеристика товара, а информация о том, какой вклад продавец желает получить от покупателя.
  </p>
</div>
